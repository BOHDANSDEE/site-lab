name: Lighthouse mobile audit

on:
  push:
    branches:
      - audit/pagespeed-20260810
  workflow_dispatch:

env:
  TARGET_ORIGIN: https://site-lab-git-perf-article-speed-20260810-sit-lab1.vercel.app

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Lighthouse
        run: |
          google-chrome --version
          npm install --global lighthouse
          lighthouse --version

      - name: Build article URL list
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          xml = open('sitemap.xml', encoding='utf-8').read()
          production_urls = re.findall(r'<loc>(https://[^<]+/statti/[^<]+/)</loc>', xml)
          assert len(production_urls) == 30, f'Expected 30 article URLs, got {len(production_urls)}'
          origin = os.environ['TARGET_ORIGIN'].rstrip('/')
          urls = []
          for url in production_urls:
              path = urllib.parse.urlparse(url).path
              urls.append(origin + path)
          with open('article-urls.txt', 'w', encoding='utf-8') as f:
              for url in urls:
                  f.write(url + '\n')
          print(f'Found {len(urls)} article URLs for {origin}')
          PY

      - name: Run Lighthouse mobile audits
        shell: bash
        run: |
          mkdir -p lighthouse-json
          python3 - <<'PY'
          import pathlib
          urls = pathlib.Path('article-urls.txt').read_text().splitlines()
          with open('/tmp/lh-jobs.txt', 'w') as f:
              for i, url in enumerate(urls, 1):
                  slug = url.rstrip('/').split('/')[-1]
                  f.write(f'{i}\t{slug}\t{url}\n')
          PY
          cat /tmp/lh-jobs.txt | xargs -P 3 -n 3 bash -c '
            index="$0"; slug="$1"; url="$2";
            echo "[$index/30] $url";
            lighthouse "$url" \
              --only-categories=performance \
              --form-factor=mobile \
              --output=json \
              --output-path="lighthouse-json/${slug}.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet \
              || echo "$url" >> lighthouse-failures.txt
          '

      - name: Summarize Lighthouse results
        shell: bash
        run: |
          cat > /tmp/summarize.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const urls = (await fs.readFile('article-urls.txt', 'utf8')).trim().split(/\n+/);
          const rows = [];
          for (const url of urls) {
            const slug = url.replace(/\/$/, '').split('/').pop();
            const file = path.join('lighthouse-json', `${slug}.json`);
            try {
              const data = JSON.parse(await fs.readFile(file, 'utf8'));
              const audits = data.audits || {};
              rows.push({
                url,
                score: Math.round((data.categories?.performance?.score ?? 0) * 100),
                fcp: audits['first-contentful-paint']?.displayValue || '',
                lcp: audits['largest-contentful-paint']?.displayValue || '',
                tbt: audits['total-blocking-time']?.displayValue || '',
                cls: audits['cumulative-layout-shift']?.displayValue || '',
                si: audits['speed-index']?.displayValue || '',
                tti: audits['interactive']?.displayValue || '',
                server: audits['server-response-time']?.displayValue || '',
                totalBytes: audits['total-byte-weight']?.displayValue || '',
                mainThread: audits['mainthread-work-breakdown']?.displayValue || '',
                unusedJsMs: audits['unused-javascript']?.details?.overallSavingsMs ?? '',
                unusedCssMs: audits['unused-css-rules']?.details?.overallSavingsMs ?? '',
                renderBlockingMs: audits['render-blocking-insight']?.details?.metricSavings?.FCP ?? audits['render-blocking-resources']?.details?.overallSavingsMs ?? '',
                fetchTime: data.fetchTime || ''
              });
            } catch (error) {
              rows.push({url, score: '', error: error.message});
            }
          }

          const esc = (v) => `"${String(v ?? '').replaceAll('"', '""')}"`;
          const headers = ['url','score','fcp','lcp','tbt','cls','si','tti','server','totalBytes','mainThread','unusedJsMs','unusedCssMs','renderBlockingMs','fetchTime','error'];
          const csv = [headers.join(','), ...rows.map((r) => headers.map((h) => esc(r[h] ?? '')).join(','))].join('\n');
          await fs.writeFile('lighthouse-mobile.csv', csv);

          const ok = rows.filter((r) => Number.isFinite(r.score));
          const sorted = [...ok].sort((a,b) => a.score - b.score);
          const average = ok.length ? Math.round(ok.reduce((s,r) => s + r.score, 0) / ok.length) : 0;
          const median = ok.length ? sorted[Math.floor(ok.length / 2)].score : 0;
          const zeroCls = ok.filter((r) => Number.parseFloat(r.cls) === 0).length;
          const summary = [
            '# Lighthouse mobile audit — PR 17 Preview',
            '',
            `Tested: ${ok.length}/${rows.length}`,
            `Average performance score: ${average}`,
            `Median performance score: ${median}`,
            `CLS 0 pages: ${zeroCls}/${ok.length}`,
            '',
            '## Lowest scores',
            ...sorted.slice(0, 10).map((r) => `- ${r.score} — ${r.url} — FCP ${r.fcp}, LCP ${r.lcp}, TBT ${r.tbt}, CLS ${r.cls}, SI ${r.si}`),
            '',
            '## Highest scores',
            ...sorted.slice(-5).reverse().map((r) => `- ${r.score} — ${r.url} — FCP ${r.fcp}, LCP ${r.lcp}, TBT ${r.tbt}, CLS ${r.cls}, SI ${r.si}`),
            ''
          ].join('\n');
          await fs.writeFile('lighthouse-summary.md', summary);
          console.log(summary);
          if (ok.length < 25) process.exit(2);
          NODE
          node /tmp/summarize.mjs

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-results
          path: |
            lighthouse-mobile.csv
            lighthouse-summary.md
            lighthouse-json/
            lighthouse-failures.txt
          if-no-files-found: warn
