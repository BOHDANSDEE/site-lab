name: GSC daily content analysis

on:
  pull_request:
    paths:
      - 'scripts/gsc-content-loop.mjs'
      - 'seo-optimizer/**'
      - '.github/workflows/gsc-content-loop.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gsc-daily-content-analysis
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: node --check scripts/gsc-content-loop.mjs
      - name: Self-test
        run: node scripts/gsc-content-loop.mjs --self-test
      - name: Validate campaign config
        run: |
          node - <<'NODE'
          const c=require('./seo-optimizer/config.json');
          if(c.dailyRewriteTarget!==10) throw Error('dailyRewriteTarget must be 10');
          if(c.campaignDays!==24) throw Error('campaignDays must be 24');
          if(c.lookbackDays<14||c.lookbackDays>90) throw Error('unsafe lookbackDays');
          console.log('config ok');
          NODE

  analyze:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check GSC/OIDC configuration
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$GSC_SITE_URL"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
      - id: google-auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false
      - name: Analyze current Google performance
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: node scripts/gsc-content-loop.mjs
      - name: Upload daily report for ChatGPT review
        uses: actions/upload-artifact@v4
        with:
          name: gsc-daily-report-${{ github.run_id }}
          path: |
            seo-optimizer/latest-report.json
            seo-optimizer/latest-report.md
          retention-days: 35
