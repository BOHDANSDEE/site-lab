name: SEO server render check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server renderer syntax
        run: |
          node --check api/article.mjs
          node --check api/article-final.mjs
          node --check api/articles.mjs
          node --check api/topic-specific-sections.mjs
          node --check api/topic-specific-meta.mjs
          node --check api/lin-experiment.mjs
          node --check scripts/seo-check.mjs
          node --check scripts/all-article-seo-check.mjs
          node --check scripts/sitemap-integrity-check.mjs
          node --check scripts/full-sitemap-coverage-check.mjs
          node --check scripts/build-unified-sitemap.mjs
      - name: Verify 12-topic navigation and indexing rules
        run: node scripts/seo-check.mjs
      - name: Verify 12 blank topic canvases
        run: node scripts/all-article-seo-check.mjs
      - name: Verify sitemap and canonical integrity
        run: node scripts/sitemap-integrity-check.mjs
      - name: Verify full sitemap coverage
        run: node scripts/full-sitemap-coverage-check.mjs
      - name: Write unified root sitemap
        run: node scripts/build-unified-sitemap.mjs --write
      - name: Commit generated sitemap
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml already unified"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Unify sitemap.xml to 259 canonical URLs"
          git push origin HEAD:${{ github.head_ref }}
