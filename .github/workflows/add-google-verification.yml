name: Add Google verification tag

on:
  push:
    branches:
      - seo/google-verification-new-domain

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verification tag
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          new_tag = '  <meta name="google-site-verification" content="nSZfxnBIPmMPXSEUs_rkxnHA9XarEOB_3JsXbVahyT8">\n'
          if 'nSZfxnBIPmMPXSEUs_rkxnHA9XarEOB_3JsXbVahyT8' not in text:
              anchor = '  <meta name="google-site-verification" content="q_j_cVJrbb5Owz3ISGOtdpvhsPv762fUO9KvKwX2SZA">\n'
              if anchor not in text:
                  raise SystemExit('Existing verification tag not found')
              text = text.replace(anchor, anchor + new_tag, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add Google verification for custom domain" || exit 0
          git push
