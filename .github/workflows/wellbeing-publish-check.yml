name: Wellbeing publish check

on:
  pull_request:
    branches: [main]

jobs:
  wellbeing-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check lib/wellbeing-render.mjs
          node --check api/articles.mjs
          node --check scripts/wellbeing-publish-check.mjs
      - name: Verify 20 published wellbeing articles and sitemap
        run: node scripts/wellbeing-publish-check.mjs
